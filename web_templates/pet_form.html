<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новый питомец</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="appbar"><a href="/app">← Назад</a><b>Новый питомец</b></header><main class="formpage"><form method="post" class="medicalform"><h1>Карточка питомца</h1><div class="two"><label>Имя<input name="name" required></label><label>Вид<select name="species"><option>собака</option><option>кошка</option><option>другое</option></select></label><label>Порода<input name="breed"></label><label>Пол<select name="sex"><option value="">Не указано</option><option>самец</option><option>самка</option></select></label><label>Возраст<input name="age" placeholder="8 лет"></label><label>Вес, кг<input name="weight" type="number" step=".01"></label><label>Кастрация/стерилизация<select name="neutered"><option value="">Не указано</option><option>да</option><option>нет</option></select></label></div><label>Хронические заболевания<textarea name="chronic"></textarea></label><label>Аллергии<textarea name="allergies"></textarea></label><label>Принимаемые препараты<textarea name="medications"></textarea></label><label>Перенесённые операции<textarea name="surgeries"></textarea></label><label>Важные диагнозы<textarea name="diagnoses"></textarea></label><button>Сохранить питомца</button></form></main></body></html>
