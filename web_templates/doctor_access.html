<div class="panel doctor-login"><h2>{{t('Открыть кабинет врача')}}</h2><p>{{t('После входа станут доступны заявки, контакты владельцев и приложенные документы.')}}</p>
<form method="post" action="/doctor/access"><input type="hidden" name="doctor_csrf" value="{{doctor_csrf}}"><input type="hidden" name="access_token" value="{{access_token}}"><input type="hidden" name="next" value="{{next_target}}"><label class="check-row"><input type="checkbox" name="remember" value="1" checked><span>{{t('Запомнить это устройство на 30 дней')}}</span></label><p class="muted">{{t('На чужом устройстве снимите эту отметку. Завершить вход можно кнопкой «Выйти из кабинета врача».')}}</p><button type="submit">{{t('Открыть заявку') if next_target!='/doctor' else t('Войти в кабинет врача')}}</button></form></div>
