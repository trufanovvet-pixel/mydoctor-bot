<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Чат — {{pet.name}}</title><link rel="stylesheet" href="/static/style.css"></head><body class="chatbody"><header class="appbar"><a href="/pets/{{pet.id}}">← {{pet.name}}</a><b>Консультация</b></header><main class="chat"><div class="chatintro"><b>МойДоктор</b><span>Контекст: {{pet.name}}</span></div>{% for m in messages %}<div class="msg {{m.role}}">{{m.content}}</div>{% else %}<div class="welcome"><h2>Что случилось с {{pet.name}}?</h2><p>Опишите проблему своими словами. Я задам только необходимые уточняющие вопросы.</p></div>{% endfor %}</main><form class="composer" method="post"><textarea name="message" rows="1" placeholder="Сообщение..." required></textarea><button>↑</button></form></body></html>
