<header class="site-top"><a class="site-brand" href="{{'/doctor' if is_doctor else '/'}}"><span>✚</span><span>{{t('МойДоктор')}}<small>{{t('Кабинет врача')}}</small></span></a><div class="header-actions">{% include 'language_switch.html' %}<a class="account-link" href="/">{{t('На сайт →')}}</a></div></header>
<aside class="site-side">{% if is_doctor %}<a href="/doctor" class="{{'current' if request.path=='/doctor' and not request.args.get('status')}}">{{t('Все заявки')}} <b class="unread-badge" data-unread-total hidden></b></a><a href="/doctor/clients" class="{{'current' if request.path.startswith('/doctor/clients')}}" data-message-notifications="doctor">{{t('Картотека владельцев')}}</a>{% for key,label in statuses.items() %}<a href="{{url_for('doctor_dashboard',status=key)}}" class="{{'current' if request.args.get('status')==key}}">{{t(label)}}</a>{% endfor %}<form method="post" action="/doctor/logout"><input type="hidden" name="doctor_csrf" value="{{doctor_csrf}}"><button class="secondary">{{t('Выйти из кабинета врача')}}</button></form>{% else %}<a class="current" href="/doctor/login">{{t('Вход для врача')}}</a>{% endif %}<a href="/">{{t('Вернуться на сайт')}}</a></aside>
