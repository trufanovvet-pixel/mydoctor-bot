<header class="site-top"><a class="site-brand" href="{{'/doctor' if is_doctor else '/'}}"><span>✚</span><span>{{t('МойДоктор')}}<small>{{t('Кабинет врача')}}</small></span></a><div class="header-actions">{% include 'language_switch.html' %}<a class="account-link" href="/">{{t('На сайт →')}}</a></div></header>
<aside class="site-side">{% if is_doctor %}<a href="/doctor" class="{{'current' if not request.args.get('status')}}">{{t('Все заявки')}}</a>{% for key,label in statuses.items() %}<a href="{{url_for('doctor_dashboard',status=key)}}" class="{{'current' if request.args.get('status')==key}}">{{t(label)}}</a>{% endfor %}{% else %}<a class="current" href="/doctor/login">{{t('Вход для врача')}}</a>{% endif %}<a href="/">{{t('Вернуться на сайт')}}</a></aside>
