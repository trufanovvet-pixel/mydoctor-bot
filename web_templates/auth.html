<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>МойДоктор</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="auth"><a href="/" class="brand">МойДоктор</a><div class="authcard"><h1>{{ 'Регистрация' if mode=='register' else 'Вход' }}</h1>{% with m=get_flashed_messages() %}{% if m %}<div class="alert">{{m[0]}}</div>{% endif %}{% endwith %}<form method="post"><label>Email<input type="email" name="email" required></label><label>Пароль<input type="password" name="password" required minlength="8"></label><button>{{ 'Создать аккаунт' if mode=='register' else 'Войти' }}</button></form><p>{% if mode=='register' %}Уже есть аккаунт? <a href="/login">Войти</a>{% else %}Нет аккаунта? <a href="/register">Регистрация</a>{% endif %}</p></div></main></body></html>
