<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008486"><title>МойДоктор · MyDoctor</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f2f8fb;color:#15324b;font:17px/1.6 system-ui,sans-serif}main{max-width:430px;margin:24px;padding:35px;background:white;border-radius:24px;text-align:center;border:1px solid #dce9ec}img{border-radius:23px}h1{font-size:27px}button{border:0;border-radius:12px;background:#008486;color:white;padding:15px 25px;font:inherit;cursor:pointer}p{color:#587488}[hidden]{display:none}</style></head><body><main><img src="/app-icon/192.png" width="80" height="80" alt=""><div data-lang="ru"><h1>Нет подключения к интернету</h1><p>Подключитесь к сети, чтобы открыть переписку, анализы и кабинет. Сохранённые на сайте данные никуда не пропали.</p><button onclick="location.reload()">Попробовать снова</button></div><div data-lang="en" hidden><h1>You’re offline</h1><p>Reconnect to open your messages, documents and account. Your saved information is still on the website.</p><button onclick="location.reload()">Try again</button></div></main><script>const lang=(navigator.language||'ru').startsWith('en')?'en':'ru';document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(x=>x.hidden=x.dataset.lang!==lang);addEventListener('online',()=>location.reload());</script></body></html>
